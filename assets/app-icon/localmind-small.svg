<?xml version="1.0" encoding="UTF-8"?>
<!--
  Local Mind icon, small sizes (16, 20, 24 and 32 px) only - a DIFFERENT silhouette, not the
  master shrunk.

  At 16 px the four-way hub reads as a plus/crosshair: the upper branch plus the two side arms
  make a symmetric cross, and the eye files it as "add"/"expand", not as a map. Dropping the upper
  branch and keeping three satellites on one side turns the shape into a tree (one card, a trunk,
  three branches) that survives the smallest size as "a map".

  Same palette and same tile as the master (#84cc16 -> #4d7c0f): the light stop is the one with
  enough contrast for the white glyph. 40 px and up use `localmind.svg`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="256" rx="100" fill="url(#sheen)"/>

  <g fill="#ffffff">
    <!-- the trunk and the three stubs (under the cards) -->
    <rect x="204" y="239" width="60" height="34"/>
    <rect x="264" y="122" width="34" height="268"/>
    <rect x="298" y="105" width="26" height="34"/>
    <rect x="298" y="239" width="26" height="34"/>
    <rect x="298" y="373" width="26" height="34"/>

    <!-- the root card -->
    <rect x="72" y="200" width="132" height="112" rx="22"/>

    <!-- the three branches -->
    <rect x="324" y="76" width="124" height="92" rx="20"/>
    <rect x="324" y="210" width="124" height="92" rx="20"/>
    <rect x="324" y="344" width="124" height="92" rx="20"/>
  </g>

  <!-- brand signature -->
  <text x="256" y="464" font-family="Segoe Script, cursive" font-size="42"
        fill="#ffffff" opacity="0.85" text-anchor="middle">Taylor</text>
</svg>
